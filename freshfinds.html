<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css?v=8acc311a">
    <title>FRESH FINDS ~ Berlin | GEISBURG RECORDS</title>
    <meta property="og:title" content="FRESH FINDS ~ Berlin">
    <meta property="og:description" content="only underground berlin sounds">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://geisburgrecords.com/assets/freshfinds_cover.jpg">
    <script>
        !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
        n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
        document,'script','https://connect.facebook.net/en_US/fbevents.js');
        // Event-IDs im SubmitHub-Format (17 alphanumerische Zeichen) — Dedup-Schluessel fuer die Conversions API
        function evid() {
            var c = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789', s = '';
            for (var i = 0; i < 17; i++) s += c.charAt(Math.floor(Math.random() * c.length));
            return s;
        }
        var CAPI = '';
        function beacon(name, id, extra) {
            if (!CAPI) return;
            var m = document.cookie.match(/_fbp=([^;]+)/), fbc = document.cookie.match(/_fbc=([^;]+)/);
            var payload = {event_name: name, event_id: id, event_source_url: location.href,
                           fbp: m ? m[1] : null, fbc: fbc ? fbc[1] : null, extra: extra || null};
            navigator.sendBeacon(CAPI, new Blob([JSON.stringify(payload)], {type: 'application/json'}));
        }
        // Eigene Zaehlung: feuert und vergisst, blockiert nie einen Klick.
        var STATS = 'https://script.google.com/macros/s/AKfycbwY8N1v8O_fxnK5_En_FlNklsynvnTjid59Gkeae_lEhmu7HjkrlEkyWfivlMkjU6ACKw/exec?s=gbr-stats-2026';
        function hit(ereignis, ziel) {
            try {
                var b = new Blob([JSON.stringify({p: location.pathname, e: ereignis,
                                                   t: ziel || '', r: document.referrer || ''})],
                                 {type: 'text/plain'});
                navigator.sendBeacon(STATS, b);
            } catch (err) {}
        }
        // Welche Anzeige: utm_content aus dem Anzeigenlink (Meta setzt {{ad.name}} ein).
        var AD = (function () {
            try {
                return (new URLSearchParams(location.search).get('utm_content') || '')
                    .replace(/[^A-Za-z0-9_.-]/g, '').slice(0, 40);
            } catch (err) { return ''; }
        })();
        fbq('set', 'autoConfig', false, '1337510651776548');
        fbq('optOut', '1337510651776548', 'ESTRuleEngine');
        fbq('init', '1337510651776548');
        var pvId = evid();
        fbq('track', 'PageView', {}, {eventID: pvId});
        beacon('PageView', pvId);
    </script>
    <noscript><img height="1" width="1" style="display:none"
        src="https://www.facebook.com/tr?id=1337510651776548&ev=PageView&noscript=1"></noscript>
</head>

<body>
    <main class="listen-page">
        <div class="listen-title">FRESH FINDS ~ Berlin</div>
        <div class="listen-artist">only underground berlin sounds</div>
        <a class="spotify" href="https://open.spotify.com/playlist/1owAFr1EJkehkSdwPWNy9g" data-a="intent://open.spotify.com/playlist/1owAFr1EJkehkSdwPWNy9g#Intent;scheme=https;package=com.spotify.music;S.browser_fallback_url=https%3A%2F%2Fopen.spotify.com%2Fplaylist%2F1owAFr1EJkehkSdwPWNy9g;end" style="display:block"
           aria-label="FRESH FINDS ~ Berlin auf Spotify"><img class="listen-cover" src="assets/freshfinds_cover.jpg" alt="FRESH FINDS ~ Berlin Playlist Cover"></a>
        <div class="listen-buttons">
            <a class="listen-btn spotify" id="play" href="https://open.spotify.com/playlist/1owAFr1EJkehkSdwPWNy9g" data-a="intent://open.spotify.com/playlist/1owAFr1EJkehkSdwPWNy9g#Intent;scheme=https;package=com.spotify.music;S.browser_fallback_url=https%3A%2F%2Fopen.spotify.com%2Fplaylist%2F1owAFr1EJkehkSdwPWNy9g;end">Play on Spotify</a>
        </div>

    </main>
    <div class="impressum">
        <a href="index.html"><img class="listen-footer-logo" src="assets/logo-upscaled-hochgeschoben.png" alt="Geisburg Records"></a>
    </div>
    <script>
        hit('pageview', AD);

        // ViewContent gilt AUSSCHLIESSLICH dem Spotify-Playlist-Link (Christian 06.08.),
        // Knopf und Cover sind beide dieser Link.
        var letzter = 0;
        function klick(e) {
            var jetzt = Date.now();
            if (jetzt - letzter < 800) { e.preventDefault(); return; }
            letzter = jetzt;
            var a = e.currentTarget, href = a.getAttribute('href'), k = evid();
            fbq('track', 'ViewContent', {content_name: 'fresh-finds-berlin-1', content_type: href}, {eventID: k});
            beacon('ViewContent', k, {content_name: 'fresh-finds-berlin-1', content_type: href});
            // Ausgang erst melden, wenn er feststeht: verdeckt = App, Seitenwechsel = Web.
            var gemeldet = false, zu = AD ? '|' + AD : '';
            function melde(art) { if (!gemeldet) { gemeldet = true; hit('click', 'spotify' + art + zu); } }
            document.addEventListener('visibilitychange', function () { if (document.hidden) melde('-app'); });
            window.addEventListener('pagehide', function () { melde('-web'); });
            setTimeout(function () { melde(''); }, 4000);
            var intent = a.getAttribute('data-a');
            if (intent && /Android/i.test(navigator.userAgent || '')) {
                e.preventDefault();
                location.href = intent;
                // Manche In-App-Browser schlucken intent:// still. Dann nach 1,5 s ins Web.
                setTimeout(function () { if (!document.hidden) location.href = href; }, 1500);
            }
        }
        var links = document.querySelectorAll('a.spotify');
        for (var i = 0; i < links.length; i++) links[i].addEventListener('click', klick);

    </script>
</body>

</html>
